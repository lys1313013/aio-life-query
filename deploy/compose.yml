name: aio-life-query
services:
  aio-life-query:
    image: ${AIO_QUERY_GATEWAY_IMAGE:-crpi-yvha9coypdedaafa.cn-beijing.personal.cr.aliyuncs.com/lys1313013/aio-life-query:latest}
    ports: ["127.0.0.1:45680:45680"]
    environment:
      AIO_QUERY_ACCESS_URL: ${AIO_QUERY_ACCESS_URL:?Set AIO Life internal check-token URL}
      AIO_QUERY_MCP_ALLOWED_ORIGINS: ${AIO_QUERY_MCP_ALLOWED_ORIGINS:-}
      AIO_QUERY_HASURA_URL: ${AIO_QUERY_HASURA_URL:-http://hasura:3000/graphql}
      AIO_QUERY_SERVICE_KEY: ${AIO_QUERY_SERVICE_KEY:?Set service secret}
      AIO_QUERY_WEBHOOK_KEY: ${AIO_QUERY_WEBHOOK_KEY:?Set webhook secret}
      AIO_QUERY_REDIS_HOST: ${AIO_QUERY_REDIS_HOST:?Set an existing Redis host}
      AIO_QUERY_REDIS_PORT: ${AIO_QUERY_REDIS_PORT:-6379}
      AIO_QUERY_REDIS_PASSWORD: ${AIO_QUERY_REDIS_PASSWORD:-}
    volumes: ["audit:/app/audit"]
    networks: [query, gateway-outbound]
    restart: unless-stopped
  hasura:
    image: ${AIO_QUERY_ENGINE_IMAGE:-crpi-yvha9coypdedaafa.cn-beijing.personal.cr.aliyuncs.com/lys1313013/aio-life-query:hasura-latest}
    group_add: ["${AIO_QUERY_CONFIG_GID:?Set configuration group id}"]
    command: ["--metadata-path", "/metadata/open_dd.json", "--authn-config-path", "/metadata/auth_config.json", "--ndc-response-size-limit", "1000000", "--request-body-limit", "65536"]
    volumes: ["../.cache/hasura:/metadata:ro"]
    networks: [query, connector]
    restart: unless-stopped
  postgresql-connector:
    image: ${AIO_QUERY_CONNECTOR_IMAGE:-crpi-yvha9coypdedaafa.cn-beijing.personal.cr.aliyuncs.com/lys1313013/aio-life-query:connector-latest}
    group_add: ["${AIO_QUERY_CONFIG_GID:?Set configuration group id}"]
    environment:
      CONNECTION_URI: ${AIO_QUERY_DATABASE_URL:?Set a PostgreSQL URI with a dedicated readonly account}
      HASURA_SERVICE_TOKEN_SECRET: ${AIO_QUERY_CONNECTOR_KEY:?Set connector secret}
    volumes: ["../.cache/hasura:/etc/connector:ro"]
    networks: [connector, database-outbound]
    restart: unless-stopped
networks:
  query: {internal: true}
  connector: {internal: true}
  gateway-outbound: {}
  database-outbound: {}
volumes:
  audit: {}
